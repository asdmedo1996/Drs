
name: Build WiPwn APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p source
          unzip -q wipwn-no-root-source.zip -d source
          echo "Project files:"
          find source -maxdepth 4 \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name gradlew \) -print

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find source -type f -name gradlew | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found in the ZIP"
            exit 1
          fi
          ROOT="$(dirname "$WRAPPER")"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wipwn-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
