
      - name: Extract Android project
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository files:"
          ls -la

          echo "Checking source ZIP:"
          test -f wipwn-no-root-source.zip
          unzip -l wipwn-no-root-source.zip | head -n 80

          mkdir -p source
          unzip -o wipwn-no-root-source.zip -d source

          echo "Extracted files:"
          find source -maxdepth 6 -type f | head -n 200

          echo "Searching for Gradle wrapper:"
          find source -type f \( -name gradlew -o -name gradlew.bat \) -print

          if ! find source -type f -name gradlew -print -quit | grep -q .; then
            echo "ERROR: ZIP does not contain gradlew, or the wrong ZIP was uploaded."
            exit 1
          fi
